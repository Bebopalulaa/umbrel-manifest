version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: arthur-manifest_app_1
      APP_PORT: 2099

  app:
    image: manifestdotbuild/manifest:latest
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 2099
      DATABASE_URL: postgresql://manifest:${APP_PASSWORD}@arthur-manifest_db_1:5432/manifest
      BETTER_AUTH_SECRET: ${APP_SEED}
      BETTER_AUTH_URL: http://${APP_DOMAIN}
      AUTO_MIGRATE: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

  db:
    image: postgres:16-alpine
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: manifest
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: manifest
    volumes:
      - ${APP_DATA_DIR}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifest"]
      interval: 10s
      timeout: 5s
      retries: 5
