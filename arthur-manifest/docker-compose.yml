version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: arthur-manifest_app_1
      APP_PORT: 2099

  app:
    image: manifestdotbuild/manifest:latest
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      PORT: 2099
      DATABASE_URL: "postgresql://manifest:${APP_PASSWORD}@arthur-manifest_db_1:5432/manifest"
      BETTER_AUTH_SECRET: "${APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR}/data:/app/data"
    networks:
      default:
        aliases:
          - arthur-manifest_app_1

  db:
    image: postgres:16-alpine
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: manifest
      POSTGRES_PASSWORD: "${APP_PASSWORD}"
      POSTGRES_DB: manifest
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "${APP_DATA_DIR}/db:/var/lib/postgresql/data"
    networks:
      default:
        aliases:
          - arthur-manifest_db_1

networks:
  default:
    name: umbrel_main_network
    external: true