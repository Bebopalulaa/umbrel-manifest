tagline: Smart model routing for agents — cut AI costs up to 70%
icon: https://raw.githubusercontent.com/Bebopalulaa/umbrel-manifest/main/arthur-manifest/icon.svg
description: >-
  Manifest is a smart model router for AI agents and applications that redirects
  each query to the right model, saving up to 70% in AI costs.


  Mix your providers: API keys, subscriptions, local models, and custom providers.
  Track every dollar, set up notifications and limits, and fallback on different
  models when queries fail.


  After installation, open the app to access the Manifest dashboard. The first
  account you create becomes the admin.
releaseNotes: >-
  Updated Manifest to latest version with smart model routing, cost tracking,
  and support for 16+ providers including OpenAI, Anthropic, Google, xAI,
  DeepSeek, Mistral, and more.
