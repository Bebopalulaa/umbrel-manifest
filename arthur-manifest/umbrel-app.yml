tagline: The ridiculously simple JavaScript backend
icon: https://raw.githubusercontent.com/Bebopalulaa/umbrel-manifest/main/arthur-manifest/icon.svg
description: >-
  Manifest is a complete backend that fits in a single YAML file. Define your
  entities, relationships, and validations declaratively and get an instant
  REST API, an admin panel, and a database with zero configuration.


  Perfect for indie developers, prototypes, and small projects. Manifest runs
  entirely on your Umbrel and keeps all your data local.


  ## Getting Started

  After installation, open the app to access the Manifest dashboard. The first
  account you create becomes the admin.
